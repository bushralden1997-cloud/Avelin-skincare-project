<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D160"/>
      <stop offset="35%" stop-color="#C8A850"/>
      <stop offset="70%" stop-color="#E8C060"/>
      <stop offset="100%" stop-color="#906828"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FCE898"/>
      <stop offset="50%" stop-color="#C8A850"/>
      <stop offset="100%" stop-color="#A07828"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Water/reflection -->
  <ellipse cx="118" cy="164" rx="58" ry="7" fill="url(#gold)" opacity="0.22"/>
  <ellipse cx="112" cy="170" rx="44" ry="4.5" fill="url(#gold)" opacity="0.13"/>

  <!-- Body -->
  <ellipse cx="122" cy="138" rx="56" ry="32" fill="url(#gold)"/>

  <!-- Tail feathers -->
  <path d="M172 128 Q194 108 186 116 Q198 90 186 100 Q194 72 180 84 Q182 58 166 74 Q160 90 170 128 Z" fill="url(#gold)" opacity="0.9"/>
  <path d="M168 126 Q184 106 180 88" fill="none" stroke="url(#goldSheen)" stroke-width="1.2" opacity="0.6"/>
  <path d="M164 128 Q178 108 176 90" fill="none" stroke="url(#goldSheen)" stroke-width="0.9" opacity="0.4"/>

  <!-- Main wing -->
  <path d="M80 132 Q54 104 62 76 Q80 50 118 72 Q96 80 84 106 Z" fill="url(#gold)" opacity="0.94"/>
  <!-- Wing feather details -->
  <path d="M80 132 Q56 106 64 80 Q78 58 108 70" fill="none" stroke="url(#goldSheen)" stroke-width="1.4" opacity="0.55"/>
  <path d="M84 128 Q62 104 70 82" fill="none" stroke="url(#goldSheen)" stroke-width="1" opacity="0.4"/>
  <path d="M88 124 Q68 102 76 84" fill="none" stroke="url(#goldSheen)" stroke-width="0.8" opacity="0.3"/>

  <!-- Secondary wing feathers -->
  <path d="M78 130 Q62 118 68 104 Q74 92 90 98" fill="none" stroke="url(#goldSheen)" stroke-width="1" opacity="0.35"/>

  <!-- Neck -->
  <path d="M118 72 Q124 54 116 36 Q110 20 102 22 Q94 24 96 36 Q98 46 106 58 Q112 65 118 72Z" fill="url(#gold)"/>
  <!-- Neck sheen -->
  <path d="M116 68 Q120 52 114 38 Q110 28 104 30" fill="none" stroke="url(#goldSheen)" stroke-width="1.5" opacity="0.5"/>

  <!-- Head -->
  <ellipse cx="100" cy="20" rx="13" ry="11" fill="url(#gold)"/>

  <!-- Head sheen -->
  <ellipse cx="97" cy="17" rx="6" ry="5" fill="url(#goldSheen)" opacity="0.4"/>

  <!-- Beak -->
  <path d="M88 19 Q74 17 72 22 Q74 25 88 22Z" fill="#A07020"/>
  <path d="M86 20.5 Q76 19 74 22" fill="none" stroke="#806010" stroke-width="0.8"/>
  <ellipse cx="80" cy="18.5" rx="2" ry="1.2" fill="#806010"/>

  <!-- Eye -->
  <circle cx="94" cy="16" r="3" fill="#2A1A08"/>
  <circle cx="95.2" cy="15" r="1" fill="white"/>
  <circle cx="94.4" cy="15.4" r="0.4" fill="white"/>

  <!-- Crown feathers -->
  <path d="M96 10 L99 4 L102 10 L105 3 L108 10 L111 5" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Crown gems (tiny dots) -->
  <circle cx="99" cy="5" r="1.2" fill="#FCE898"/>
  <circle cx="105" cy="4" r="1.2" fill="#FCE898"/>
  <circle cx="111" cy="6" r="1.2" fill="#FCE898"/>
</svg>
